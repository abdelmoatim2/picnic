<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>الطلبات</title>
<style>
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.tabs button{border-radius:999px;padding:8px 16px}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
.tabs .sp{flex:1}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin:10px 0}
.oc{background:var(--card);border:1px solid var(--bd);border-inline-start:8px solid var(--bd);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.oc.s-pending{border-inline-start-color:var(--wn)}.oc.s-new{border-inline-start-color:var(--bl)}.oc.s-prep{border-inline-start-color:#a855f7}
.oc.s-ready{border-inline-start-color:var(--ok)}.oc.s-out{border-inline-start-color:#0ea5e9}.oc.s-done{opacity:.7}.oc.s-cancel{opacity:.55}
.oc.fresh{animation:pl 1.2s ease-in-out 6}@keyframes pl{50%{box-shadow:0 0 0 4px var(--ac)}}
@media (prefers-reduced-motion:reduce){.oc.fresh{animation:none;box-shadow:0 0 0 3px var(--ac)}}
.oh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.oh .no{font-size:22px;font-weight:700}.oh .ty{font-weight:700}.oh .ag{margin-inline-start:auto;font-size:12.5px;color:var(--mut)}
.bd{font-size:12.5px;padding:2px 10px;border-radius:999px;border:1px solid currentColor;font-weight:700}
.bd.pending{color:var(--wn)}.bd.new{color:var(--bl)}.bd.prep{color:#a855f7}.bd.ready{color:var(--ok)}.bd.out{color:#0ea5e9}.bd.done{color:var(--mut)}.bd.cancel{color:var(--dg)}
.it{margin:0;padding:0;list-style:none}.it li{display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed var(--bd);font-size:16px}.it li b{min-width:34px}
.nt{background:#fef3c7;color:#78350f;border-radius:8px;padding:6px 10px;font-weight:700}
.dl{font-size:14px;background:var(--bg);border-radius:8px;padding:8px 10px;display:grid;gap:2px}.dl a{color:var(--ac);font-weight:700}
.ft{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;color:var(--mut)}.ft b{color:var(--tx);font-size:17px}
.ac{display:flex;gap:8px;flex-wrap:wrap}.ac button{flex:1;min-height:44px}.ac button.sm{flex:none;min-height:36px;padding:4px 10px;font-size:13px}
.em{text-align:center;color:var(--mut);padding:50px 10px;grid-column:1/-1}
</style></head><body>
<header class="sh"><div class="w"><h1 id="ttl">الطلبات</h1><div class="tb"><span id="who" class="mut"></span><select id="pp" class="ppsel" title="نوع الطابعة / الورق" onchange="setPaper(this.value)"></select><a class="bt" id="lk" href="dashboard.html" hidden>📊 الداشبورد</a><a class="bt" id="lkk" href="kitchen.html" hidden>🍳 المطبخ</a><button onclick="logout()">خروج</button></div></div></header>
<div class="w"><div class="tabs" id="tabs"></div><div class="grid" id="list"></div></div>
<script>window.addEventListener("load",function(){if(typeof staffInit==="undefined")document.body.insertAdjacentHTML("afterbegin",'<p style="margin:0;padding:14px;background:#b42318;color:#fff;text-align:center;font:15px Tahoma">تعذر تحميل الملف staff.js: تأكد أنه مرفوع بجانب هذه الصفحة وأن صلاحيته 644</p>')})</script>
<script src="staff.js"></script>
<script>
let tab="act",typ="",FR={};
const prev=(o)=>({new:o.type=="h"?"pending":null,prep:"new",ready:"prep",out:"ready",done:o.type=="h"?"out":"ready",cancel:o.type=="h"?"pending":"new"})[o.status]||null;
staffInit({title:"الطلبات",roles:["manager","waiter","delivery"],onReady:u=>{
  $("who").textContent=u.name+" · "+ROLE[u.role];$("pp").innerHTML=paperOpts();setPaper(lget("paper","80"));
  if(u.role=="manager"){$("lk").hidden=false;$("lkk").hidden=false}
  setTimeout(()=>{audio();if(!AC||AC.state!=="running")sndBar(true)},400);
  OR.start((list,fresh)=>{
    if(fresh.length){fresh.forEach(o=>FR[o.id]=Date.now());beep(3)}
    draw(list)})}});
const act=o=>o.status!="done"&&o.status!="cancel";
function draw(list){
  const A=list.filter(act),Dn=list.filter(o=>!act(o));
  const T=[["act","النشطة ("+A.length+")"],["done","المنتهية ("+Dn.length+")"]];
  let h=T.map(t=>`<button class="${tab==t[0]?"on":""}" onclick="tab='${t[0]}';draw(OR.list())">${t[1]}</button>`).join("");
  if(ME.role=="manager"){h+='<span class="sp"></span>'+[["","الكل"],["d","🍽️ صالة"],["h","🛵 دليفري"]].map(t=>`<button class="${typ==t[0]?"on":""}" onclick="typ='${t[0]}';draw(OR.list())">${t[1]}</button>`).join("")}
  $("tabs").innerHTML=h;
  let L=(tab=="act"?A.slice().reverse():Dn);if(typ)L=L.filter(o=>o.type==typ);
  $("list").innerHTML=L.length?L.map(card).join(""):'<div class="em">'+(tab=="act"?"لا توجد طلبات نشطة حالياً ✓":"لا توجد طلبات")+'</div>';
}
function btns(o){const a=ALLOW[ME.role],b=[];
  const add=(s,l,c)=>{if(a.indexOf(s)>=0)b.push(`<button class="${c||""}" onclick="setS(this,${o.id},'${s}')">${l}</button>`)};
  if(o.status=="pending"){add("new","✅ تأكيد وتحويل للمطبخ","pr");add("cancel","إلغاء","dg")}
  else if(o.status=="new"){add("prep","👨‍🍳 بدء التحضير","pr");add("cancel","إلغاء","dg")}
  else if(o.status=="prep")add("ready","✔️ جاهز","pr");
  else if(o.status=="ready"){o.type=="h"?add("out","🛵 خرج للتوصيل","pr"):add("done","🍽️ تم التسليم","pr")}
  else if(o.status=="out")add("done","✅ تم التسليم","pr");
  const p=prev(o);if(p&&a.indexOf(p)>=0)b.push(`<button class="sm" title="تراجع" onclick="setS(this,${o.id},'${p}')">↩ تراجع</button>`);
  b.push(`<button class="sm" title="طباعة" onclick="pr(${o.id})">🖨️</button>`);
  return b.join("")}
function card(o){
  const fresh=FR[o.id]&&Date.now()-FR[o.id]<25000;
  let h=`<div class="oc s-${o.status}${fresh?" fresh":""}"><div class="oh"><span class="no">#${o.no}</span><span class="ty">${o.type=="d"?"🍽️ طاولة "+esc(o.tbl):"🛵 دليفري"}</span><span class="bd ${o.status}">${ST[o.status]}</span>${o.batches>1?'<span class="bd new">+ ملحق</span>':""}<span class="ag" title="${hhmm(o.created)}">${hhmm(o.created)} · ${ago(o.created)}</span></div>`;
  if(o.type=="h"){const m=o.lat!=null?`<a href="https://www.google.com/maps?q=${o.lat},${o.lng}" target="_blank" rel="noopener">🗺️ فتح الموقع على الخريطة</a>`:"";
    h+=`<div class="dl"><div>👤 <b>${esc(o.cname)}</b></div><div>📞 <a href="tel:${esc(o.phone)}" dir="ltr">${esc(o.phone)}</a></div><div>📍 ${esc(o.addr)}</div>${m}</div>`}
  if(o.type=="d"&&o.phone)h+=`<div class="dl"><div>📞 <a href="tel:${esc(o.phone)}" dir="ltr">${esc(o.phone)}</a></div></div>`;
  h+=`<ul class="it">${itemsLI(o)}</ul>`;
  if(o.note)h+=`<div class="nt">📝 ${esc(o.note)}</div>`;
  h+=`<div class="ft"><b>${money(o.total)}</b>`;
  if(ME.role=="manager"){const L=OR.staff.filter(s=>s.role==(o.type=="d"?"waiter":"delivery"));
    h+=`<select onchange="assign(${o.id},this.value)" title="تحويل الطلب لموظف"><option value="0">— بدون موظف —</option>${L.map(s=>`<option value="${s.id}"${s.id===o.owner?" selected":""}>${esc(s.name)}</option>`).join("")}</select>`}
  else if(o.owner_name)h+=`<span>الموظف: ${esc(o.owner_name)}</span>`;
  h+=`</div>`;
  if(ME.role=="manager"&&o.owner==null&&o.type=="d"&&act(o))h+=`<div class="mut" style="font-size:12.5px">⚠️ الطاولة غير مربوطة بأي ويتر</div>`;
  return h+`<div class="ac">${btns(o)}</div></div>`}
async function setS(b,id,s){
  if(s=="cancel"&&!confirm("إلغاء هذا الطلب؟"))return;
  b.disabled=true;
  try{const j=await api("order_set",{id,status:s});OR.put(j.order)}catch(e){if(e.message!="auth")alert(e.message);b.disabled=false}}
async function assign(id,v){try{const j=await api("order_assign",{id,owner:+v});OR.put(j.order)}catch(e){if(e.message!="auth")alert(e.message);draw(OR.list())}}
function pr(id){const o=OR.map[id];if(o)printTicket(o)}
setInterval(()=>{if(ME&&OR.cb)draw(OR.list())},30000);
</script></body></html>
