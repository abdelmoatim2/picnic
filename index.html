 if(c.meals&&c.meals.on){const hh=new Date().getHours();meal=hh>=4&&hh<11?"b":"l"}
 mode=defMode();
 applyLang();resumeOrder();}
const vis=k=>!meal||!k.meal||k.meal==meal;
function navDraw(){$("nav").innerHTML=M.cats.filter(vis).map(k=>`<button onclick="go(${k.id},this)">${esc(nm(k))}</button>`).join("")}
function drawMeals(){const l=M.config.meals,en=LANG=="en";
 const B=en?(l.be||X("bfast")):l.b,Bt=en?(l.bte||l.bt):l.bt,Lm=en?(l.le||X("lunch")):l.l,Lt=en?(l.lte||l.lt):l.lt;
 $("mt").innerHTML=`<button class="${meal=="b"?"on":""}" onclick="setMeal('b')">${esc(B)}<small>${esc(Bt||"")}</small></button><button class="${meal=="l"?"on":""}" onclick="setMeal('l')">${esc(Lm)}<small>${esc(Lt||"")}</small></button>`}
function setMeal(m){meal=m;drawMeals();navDraw();render();window.scrollTo({top:0})}
function go(id,b){$("c"+id).scrollIntoView({behavior:"smooth"});document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x===b))}
function btn(i){const t=IT[i];if(!t.avail)return'<span class="no">'+X("off")+'</span>';const c=cart[i]||0;return c?`<div class="q"><button onclick="ch(${i},1)">+</button><b>${c}</b><button onclick="ch(${i},-1)">−</button></div>`:`<button class="add" onclick="ch(${i},1)">${X("add")}</button>`}
function render(){
 const q=$("s").value.trim().toLowerCase(),en=LANG=="en";let h="";
 M.cats.forEach(k=>{if(!q&&!vis(k))return;const l=M.items.filter(i=>i.cat==k.id&&(!q||(i.ar+" "+i.en+" "+i.desc+" "+(i.desc_en||"")).toLowerCase().includes(q)));if(!l.length)return;
  const kn=en?(k.note_en||k.note):k.note;
  h+=`<h2 id="c${k.id}">${k.img?`<img src="${esc(k.img)}" alt="">`:""}${esc(nm(k))}${!en&&k.en?`<small>${esc(k.en)}</small>`:""}</h2>${kn&&!q?`<p class="sn">${esc(kn)}</p>`:""}`+l.map(i=>`<div class="it${i.avail?"":" off"}">${i.img?`<img class="th" loading="lazy" src="${esc(i.img)}" alt="" onclick="zoom('${esc(i.img)}')">`:""}<div class="n">${i.new?'<span class="nw">'+X("nw")+'</span>':""}${esc(nm(i))}${!en&&i.en?`<span class="en">${esc(i.en)}</span>`:""}${ds(i)?`<span class="ds">${esc(ds(i))}</span>`:""}<div class="p">${fmt(u(i.price))}</div></div><div id="b${i.id}">${btn(i.id)}</div></div>`).join("")});
 $("m").innerHTML=h||'<p class="ld">'+X("none")+'</p>'}
function openI(){infoDraw();$("so").style.display="flex"}
function infoDraw(){const f=M.info,q=$("iq").value.trim().toLowerCase();$("itt").textContent=f.title;
 $("ith").innerHTML="<tr>"+f.cols.map(c=>`<th>${esc(c)}</th>`).join("")+"</tr>";
 $("itb").innerHTML=f.rows.filter(r=>!q||r.join(" ").toLowerCase().includes(q)).map(r=>"<tr>"+r.map((v,i)=>`<td data-l="${esc(f.cols[i]||"")}">${esc(v)}</td>`).join("")+"</tr>").join("")}
function zoom(s){$("li").src=s;$("lb").style.display="flex"}
const sub=()=>Object.keys(cart).reduce((a,i)=>a+u(IT[i].price)*cart[i],0),cnt=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const sv=()=>Math.round(sub()*(M.config.service||0)/100),gt=()=>sub()+sv();
function ch(i,d){if(!IT[i].avail)return;ORDKEY=newKey();cart[i]=(cart[i]||0)+d;if(cart[i]<=0)delete cart[i];const b=$("b"+i);if(b)b.innerHTML=btn(i);upd();if($("sh").style.display=="flex")listC()}
function upd(){const c=cnt();$("fc").style.display=c?"block":"none";$("cc").textContent="🛒 "+c+" "+X("items");$("ct").textContent=fmt(gt())}
const canAdd=()=>TK&&TK.type=="d"&&QT&&(TK.s=="new"||TK.s=="prep");
function addonInfo(){if(!(TK&&TK.type=="d"&&QT))return"";if(canAdd())return`<div class="note" style="color:var(--h2);font-weight:700">${esc(X("addonNote",{n:TK.no}))}</div>`;if(TK.s=="ready"||TK.s=="out")return`<div class="note">${esc(X("newAfter",{n:TK.no}))}</div>`;return""}
function modes(){const c=M.config;$("md").innerHTML=(mode=="d"&&QT?'<div class="note">'+esc(X("tableNote",{n:QT}))+'</div>'+addonInfo():mode=="h"&&c.dine?'<div class="note">'+X("delNote")+'</div>':"");fields()}
function fields(){const sp=esc(ls("ph","")),sn=esc(ls("nm",""));
 $("fd").innerHTML=mode=="d"?`${QT?"":`<input type="text" id="tb" inputmode="numeric" placeholder="${X("tablePh")}" oninput="valid()">`}<input type="text" id="ph" inputmode="tel" dir="ltr" value="${sp}" placeholder="${X("phonePh")}" oninput="valid()"><div class="note">${X("phoneNote")}</div>`:mode=="h"?`<input type="text" id="nmc" value="${sn}" placeholder="${X("namePh")}" oninput="valid()"><input type="text" id="ph" inputmode="tel" dir="ltr" value="${sp}" placeholder="${X("phonePh")}" oninput="valid()"><textarea id="ad" rows="3" placeholder="${X("addrPh")}" oninput="valid()"></textarea><button type="button" class="gb" id="gb" onclick="getGeo()">${X("geoBtn")}</button><div class="note" id="gs">${geo?X("geoOk"):X("geoHint")}</div>`:"";valid()}
function getGeo(){const b=$("gb"),t=$("gs");if(!navigator.geolocation){t.textContent=X("geoNo");return}b.disabled=true;t.textContent=X("geoWait");
 navigator.geolocation.getCurrentPosition(p=>{geo={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)};t.textContent=X("geoOk");b.disabled=false},()=>{t.textContent=X("geoFail");b.disabled=false},{enableHighAccuracy:true,timeout:15000,maximumAge:60000})}
const g=x=>$(x)?$(x).value.trim():"";
function valid(){$("send").disabled=sending||!(cnt()&&(g("ph").replace(/\D/g,"").length>=7&&((mode=="d"&&(QT||g("tb")))||(mode=="h"&&g("nmc")&&g("ad")))))}
function sendLabel(){$("send").textContent=sending?X("sending"):canAdd()?X("sendAdd",{n:TK.no}):X("send")}
function listC(){$("ci").innerHTML=Object.keys(cart).map(i=>`<div class="row"><span>${esc(nm(IT[i]))}</span><span class="q"><button onclick="ch(${i},1)">+</button><b>${cart[i]}</b><button onclick="ch(${i},-1)">−</button></span><span>${fmt(u(IT[i].price)*cart[i])}</span></div>`).join("");
 const s=M.config.service;$("tt").innerHTML=s>0?`${X("sub")}: ${fmt(sub())}<br>${X("svc")} ${s}%: ${fmt(sv())}<br>${X("total")}: ${fmt(gt())}`:`${X("total")}: ${fmt(gt())}`;
 $("sn").textContent=s>0?X("svcNote",{s}):"";sendLabel();valid();if(!cnt())closeC()}
function openC(){modes();listC();$("sh").style.display="flex"}function closeC(){$("sh").style.display="none"}
async function send(){if(!cnt()||sending)return;
 const p={key:ORDKEY,lang:LANG,mode,table:QT||g("tb"),name:g("nmc"),phone:g("ph"),address:g("ad"),note:g("nt"),hp:g("hp"),lat:geo?geo.lat:null,lng:geo?geo.lng:null,items:Object.keys(cart).map(i=>({id:+i,q:cart[i]}))};
 sending=true;sendLabel();$("send").disabled=true;
 let j=null,net=false;
 try{const r=await fetch("api.php?action=order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});net=r.status>=500;try{j=await r.json()}catch(e){net=true}}catch(e){net=true}
 sending=false;sendLabel();valid();
 if(j&&j.ok&&!net){TK={t:j.token,no:j.no,type:j.type,s:j.status,add:!!j.addon};lsw("lastOrder",JSON.stringify({t:j.token,no:j.no,at:Date.now()}));lsw("ph",p.phone);if(p.name)lsw("nm",p.name);
  cart={};geo=null;ORDKEY=newKey();mode=defMode();$("nt").value="";closeC();render();upd();window.scrollTo({top:0});if(j.token)openT()}
 else if(net||!j){if(confirm(X("waConfirm")))sendWA()}
 else flash(j.error||X("failSend"))}
function openT(){const t=TK;$("trn").textContent="#"+t.no;$("trw").href="https://wa.me/"+M.config.wa;$("tr").style.display="flex";drawT();clearTimeout(TT);pollT()}
function closeT(){$("tr").style.display="none";if(TK&&(TK.s=="done"||TK.s=="cancel")){TK=null;$("ob").hidden=true}else drawB()}
function drawT(){const t=TK;if(!t)return;$("trt").textContent=X(t.add?"addedTitle":"gotTitle");$("trs").textContent=X("st_"+t.s);
 const seq=t.type=="h"?["pending","new","prep","ready","out","done"]:["new","prep","ready","done"],k=seq.indexOf(t.s);
 $("trp").innerHTML=t.s=="cancel"?"":seq.map((x,i)=>`<span class="${i<=k?"on":""}">${X("sp_"+x)}</span>`).join("");
 $("trm").textContent=t.s=="pending"?X("trPend"):X("trAuto")}
async function pollT(){if(!TK||TK.s=="done"||TK.s=="cancel")return;
 try{const r=await fetch("api.php?action=track&t="+TK.t+"&_="+Date.now(),{cache:"no-store"}),j=await r.json();if(j&&j.ok){TK.s=j.status;drawT();drawB()}}catch(e){}
 if(TK&&TK.s!="done"&&TK.s!="cancel")TT=setTimeout(pollT,6000)}
function drawB(){const b=$("ob");if(!TK||TK.s=="done"||TK.s=="cancel"){b.hidden=true;return}b.hidden=false;b.innerHTML=`<button onclick="openT()">${esc(X("ob",{n:TK.no,s:X("st_"+TK.s)}))}</button>`}
async function resumeOrder(){let o=null;try{o=JSON.parse(localStorage.getItem("lastOrder")||"null")}catch(e){}
 if(!o||!o.t||Date.now()-o.at>6*3600*1000)return;
 try{const j=await(await fetch("api.php?action=track&t="+o.t+"&_="+Date.now(),{cache:"no-store"})).json();if(j&&j.ok&&j.status!="done"&&j.status!="cancel"){TK={t:o.t,no:j.no,type:j.type,s:j.status};drawB();pollT()}}catch(e){}}
function sendWA(){if(!cnt())return;const c=M.config;
 let m=`🧾 *طلب جديد - ${c.name}*\n━━━━━━━━━━\n`;
 Object.keys(cart).forEach(i=>m+=`▪️ ${IT[i].ar} × ${cart[i]} = ${fmt(u(IT[i].price)*cart[i])}\n`);
 m+="━━━━━━━━━━\n";if(c.service>0)m+=`المجموع: ${fmt(sub())}\nخدمة ${c.service}%: ${fmt(sv())}\n`;
 m+=`💰 *الإجمالي: ${fmt(gt())}*\n\n`;
 m+=mode=="d"?`🍽️ *طاولة رقم:* ${QT||g("tb")}\n📞 ${g("ph")}\n`:`🛵 *توصيل*\n👤 الاسم: ${g("nmc")}\n📞 ${g("ph")}\n📍 العنوان: ${g("ad")}\n📌 سيتم إرسال الموقع بعد إرسال الطلب\n`;
 if(g("nt"))m+=`📝 ملاحظات: ${g("nt")}\n`;
 const url="https://wa.me/"+c.wa+"?text="+encodeURIComponent(m);
 const w=window.open(url,"_blank");if(!w)location.href=url;
 cart={};geo=null;ORDKEY=newKey();mode=defMode();$("nt").value="";closeC();render();upd();window.scrollTo({top:0});flash(X("waDone"))}
$("s").oninput=()=>M&&render();
{const sl=ls("lang","");if(sl){LANG=sl=="en"?"en":"ar";document.documentElement.lang=LANG;document.documentElement.dir=LANG=="en"?"ltr":"rtl"}else $("lg").style.display="flex"}
boot();
</script></body></html>
