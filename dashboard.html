<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>الداشبورد</title>
<style>
.rg{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.rg button.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
.kp{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:12px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px}.k small{color:var(--mut);display:block}.k b{font-size:24px;line-height:1.3;display:block}.k span{font-size:13px;color:var(--mut)}
.k.d{border-top:5px solid var(--bl)}.k.h{border-top:5px solid #0ea5e9}.k.t{border-top:5px solid var(--ac)}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-bottom:12px}
.bx{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}.bx h2{margin:0 0 10px;font-size:16px}
.rw{display:grid;grid-template-columns:minmax(90px,1.2fr) 2fr auto;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.br{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}.br i{display:block;height:100%;background:var(--ac);border-radius:6px}
.rw .v{text-align:left;white-space:nowrap;font-weight:700}.rw .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch{display:flex;align-items:flex-end;gap:3px;height:150px;overflow-x:auto;padding-bottom:2px}.ch div{flex:1;min-width:14px;background:var(--ac);border-radius:4px 4px 0 0;opacity:.85;position:relative}
.cl{display:flex;gap:3px;overflow:hidden;font-size:10.5px;color:var(--mut)}.cl span{flex:1;min-width:14px;text-align:center}
.sc{display:flex;gap:8px;flex-wrap:wrap}.sc span{padding:4px 12px;border-radius:999px;border:1px solid var(--bd);font-size:13.5px}
.em{color:var(--mut);padding:12px 0;text-align:center}
</style></head><body>
<header class="sh"><div class="w"><h1>📊 داشبورد المدير</h1><div class="tb"><a class="bt" href="orders.html">📋 الطلبات</a><a class="bt" href="kitchen.html">🍳 المطبخ</a><button onclick="load()">تحديث</button><button onclick="logout()">خروج</button></div></div></header>
<div class="w"><div class="rg" id="rg"></div><div id="out"><p class="em">جارٍ التحميل...</p></div></div>
<script>window.addEventListener("load",function(){if(typeof staffInit==="undefined")document.body.insertAdjacentHTML("afterbegin",'<p style="margin:0;padding:14px;background:#b42318;color:#fff;text-align:center;font:15px Tahoma">تعذر تحميل الملف staff.js: تأكد أنه مرفوع بجانب هذه الصفحة وأن صلاحيته 644</p>')})</script>
<script src="staff.js"></script>
<script>
let R="today",F="",T="";
const ymd=d=>d.toLocaleDateString("en-CA");
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function range(){const t=new Date();
  if(R=="today")return[ymd(t),ymd(t)];if(R=="yest")return[ymd(addD(t,-1)),ymd(addD(t,-1))];
  if(R=="7")return[ymd(addD(t,-6)),ymd(t)];if(R=="30")return[ymd(addD(t,-29)),ymd(t)];
  if(R=="month")return[ymd(new Date(t.getFullYear(),t.getMonth(),1)),ymd(t)];
  return[F||ymd(t),T||ymd(t)]}
staffInit({title:"الداشبورد",roles:["manager"],onReady:()=>{drawRg();load();setInterval(load,30000)}});
function drawRg(){const P=[["today","اليوم"],["yest","أمس"],["7","آخر 7 أيام"],["30","آخر 30 يوم"],["month","هذا الشهر"],["c","فترة مخصصة"]];
  $("rg").innerHTML=P.map(p=>`<button class="${R==p[0]?"on":""}" onclick="R='${p[0]}';drawRg();load()">${p[1]}</button>`).join("")+(R=="c"?`<input type="date" value="${F||ymd(new Date())}" onchange="F=this.value;load()"> إلى <input type="date" value="${T||ymd(new Date())}" onchange="T=this.value;load()">`:"")}
async function load(){const[f,t]=range();let s;
  try{s=await api("stats&from="+f+"&to="+t)}catch(e){if(e.message!="auth")$("out").innerHTML='<p class="em">'+esc(e.message)+'</p>';return}
  const mx=(a,k)=>Math.max(1,...a.map(x=>x[k]));
  const kp=`<div class="kp"><div class="k t"><small>إجمالي الطلبات</small><b>${s.total.orders}</b><span>${s.total.cancel?s.total.cancel+" ملغي":"بدون ملغي"}</span></div>
<div class="k t"><small>إجمالي المبيعات</small><b>${money(s.total.sales)}</b><span>متوسط الطلب ${money(s.total.avg)}</span></div>
<div class="k d"><small>🍽️ داخل المطعم</small><b>${s.dine.n}</b><span>${money(s.dine.sales)}</span></div>
<div class="k h"><small>🛵 توصيل</small><b>${s.delivery.n}</b><span>${money(s.delivery.sales)}</span></div></div>`;
  const st=Object.keys(ST).filter(k=>s.status[k]).map(k=>`<span>${ST[k]}: <b>${s.status[k]}</b></span>`).join("")||'<span class="mut">لا توجد طلبات</span>';
  const tq=mx(s.top,"q");
  const top=s.top.length?s.top.map((x,i)=>`<div class="rw"><span class="n" title="${esc(x.n)}">${i+1}. ${esc(x.n)}</span><div class="br"><i style="width:${x.q/tq*100}%"></i></div><span class="v">${x.q} × <small class="mut">${money(x.rev)}</small></span></div>`).join(""):'<div class="em">لا توجد بيانات</div>';
  const ms=mx(s.staff,"sales");
  const stf=s.staff.length?s.staff.map((x,i)=>`<div class="rw"><span class="n">${i==0?"🏆 ":""}${esc(x.name)} <small class="mut">${ROLE[x.role]||""}</small></span><div class="br"><i style="width:${x.sales/ms*100}%"></i></div><span class="v">${money(x.sales)} <small class="mut">(${x.n})</small></span></div>`).join(""):'<div class="em">لا توجد طلبات مسلّمة بعد</div>';
  const md=mx(s.daily,"sales"),many=s.daily.length>1;
  const dc=many?`<div class="ch">${s.daily.map(d=>`<div title="${d.d}: ${d.n} طلب · ${money(d.sales)}" style="height:${Math.max(2,d.sales/md*100)}%"></div>`).join("")}</div><div class="cl">${s.daily.map(d=>`<span>${d.d.slice(8)}</span>`).join("")}</div>`:"";
  $("out").innerHTML=kp+`<div class="bx" style="margin-bottom:12px"><h2>حالات الطلبات</h2><div class="sc">${st}</div></div>`+
   `<div class="g2"><div class="bx"><h2>🍽️ الأصناف الأكثر طلباً</h2>${top}</div><div class="bx"><h2>🏆 مبيعات الموظفين <small class="mut">(الطلبات المسلّمة فقط)</small></h2>${stf}</div></div>`+
   (many?`<div class="bx"><h2>المبيعات اليومية</h2>${dc}</div>`:"")}
</script></body></html>
